
# --- Build system configuration

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["unidas"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "unidas.__version__"}

# --- Project Metadata

[project]
name = "unidas"
dynamic = ["version"]

authors = [
  { name="Derrick Chambers", email="chambers.ja.derrick@gmail.com" },
]

description = "A DAS compatibility library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Topic :: Scientific/Engineering",
]

keywords = ["geophysics", "distributed-acoustic-sensing"]

# --- Dependencies

dependencies = [
    "numpy>=1.26; python_version < '3.13'",
    "numpy>=2; python_version >= '3.13'",
]

[project.optional-dependencies]

extras = [
    "xarray",
    "dascore; python_version < '3.13'",
    "daspy-toolbox; python_version < '3.13'",
    "lightguide; platform_system != 'Windows' and python_version < '3.13'",
    "xdas; python_version < '3.13'",
    # This is due to pyrocko. Remove when it has a new release.
    "numpy<2; python_version < '3.13'",
]

test = [
    "prek",
    "pytest",
    "ruff",
    "pooch",
    "pytest-cov",
]

dev = ["unidas[test]", "unidas[extras]"]

# --- URLs for project

[project.urls]
"Bug Tracker" = "https://github.com/dasdae/unidas/issues"
"Documentation" = "https://github.com/dasdae/unidas"
"Homepage" = "https://github.com/dasdae/unidas"

# --- External tool configuration

[tool.ruff]

src = ["src"]

line-length = 88

# enable certain types of linting
lint.select = [
    "E",
    "F",
    "UP",
    "RUF",
    "I001",
    "D",
    "FA",
    "T",
    "N",
    "NPY",
    "NPY201",
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__init__.py"
]

# lowest python version supported
target-version = "py310"

lint.fixable = ["ALL"]

# List of codes to ignore
lint.ignore = ["D105", "D107", "D401", "D205", "D200", "D400"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

# config for docstring parsing
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore hdf5 warnings from pytables, See pytables #1035
    'ignore::Warning:tables:'
]

[tool.ruff.format]
# Use `\n` line endings for all files
line-ending = "lf"
