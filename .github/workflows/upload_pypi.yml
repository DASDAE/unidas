# Tag, release, and upload to PyPI when the package version changes on main.
name: ReleasePackage
on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      # This must be enabled for trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Detect release version
        id: detect
        shell: bash
        run: |
          if ! git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- src/unidas.py; then
            old_version=$(git show "${{ github.event.before }}:src/unidas.py" | python -c 'import re, sys; text = sys.stdin.read(); match = re.search(r"^__version__ = \"([^\"]+)\"", text, re.MULTILINE); print(match.group(1) if match else "")')
            new_version=$(python -c 'import re; from pathlib import Path; text = Path("src/unidas.py").read_text(); match = re.search(r"^__version__ = \"([^\"]+)\"", text, re.MULTILINE); print(match.group(1) if match else "")')
          else
            old_version=""
            new_version=""
          fi

          if [ -z "$new_version" ] || [ "$old_version" = "$new_version" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be stable SemVer (X.Y.Z); got $new_version" >&2
            exit 1
          fi

          tag="v$new_version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.detect.outputs.should_release == 'true'
        shell: bash -l {0}
        run: |
          uv build
          uv publish --trusted-publishing always

      - name: Create tag
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.detect.outputs.tag }}"
          git push origin "${{ steps.detect.outputs.tag }}"

      - name: Create GitHub release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.detect.outputs.tag }}" --generate-notes
